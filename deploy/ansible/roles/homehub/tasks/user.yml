---
- name: Create the service group
  ansible.builtin.group:
    name: "{{ homehub_group }}"
    state: present
  when:
    - homehub_create_user | bool
    - homehub_user != ansible_user

- name: Create the service user
  ansible.builtin.user:
    name: "{{ homehub_user }}"
    group: "{{ homehub_group }}"
    home: "/home/{{ homehub_user }}"
    shell: /bin/bash
    create_home: true
    state: present
  when:
    - homehub_create_user | bool
    - homehub_user != ansible_user

- name: Look up the service user
  ansible.builtin.getent:
    database: passwd
    key: "{{ homehub_user }}"
    fail_key: false

- name: Require an existing service user
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd is mapping
      - homehub_user in ansible_facts.getent_passwd
    fail_msg: >-
      User {{ homehub_user }} does not exist.
      Set homehub_create_user: true or choose an existing homehub_user.
    quiet: true

- name: Look up the service group
  ansible.builtin.getent:
    database: group
    key: "{{ homehub_group }}"
    fail_key: false

- name: Require an existing service group
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_group is mapping
      - homehub_group in ansible_facts.getent_group
    fail_msg: >-
      Group {{ homehub_group }} does not exist.
      Set homehub_group to the user's primary group.
    quiet: true

- name: Use the service user's real home directory
  ansible.builtin.set_fact:
    homehub_user_home: "{{ ansible_facts.getent_passwd[homehub_user][4] }}"
  when: homehub_user_home | length == 0

- name: Check the service user's home directory
  ansible.builtin.assert:
    that:
      - homehub_user_home | length > 0
    fail_msg: "Could not determine the home directory for {{ homehub_user }}."
    quiet: true
